services:
  - type: web
    name: mynhc
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mynhc-db
          property: connectionString

databases:
  - name: mynhc-db
    databaseName: mynhc
    user: mynhc_user
    plan: free
