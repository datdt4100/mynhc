name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'   # mỗi 10 phút
  workflow_dispatch:           # cho phép chạy thủ công

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping mynhc
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://mynhc.onrender.com)
          echo "HTTP status: $STATUS"
