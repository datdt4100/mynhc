{% include "admin/_op_chrome_css.html" %}
<style>
  body { background: #F0F9FF; }
  /* ── Admin-style list card ── */
  .section-card { background:#fff; border-radius:16px; border:1.5px solid #E2E8F0; overflow:hidden; margin-bottom:24px; box-shadow:0 1px 6px rgba(0,0,0,.04); }
  .section-toolbar { padding:10px 16px; background:#FAFBFC; border-bottom:1.5px solid #E2E8F0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .search-box { position:relative; flex:1; min-width:160px; max-width:300px; }
  .search-box i { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:#94A3B8; font-size:.85rem; pointer-events:none; }
  .search-box input { width:100%; padding:5px 10px 5px 30px; border:1.5px solid #E2E8F0; border-radius:8px; font-size:.78rem; color:#334155; background:#fff; outline:none; transition:border-color .15s; }
  .search-box input:focus { border-color:#7C3AED; }
  .chip-bar { padding:10px 16px 2px; background:#FAFBFC; border-bottom:1.5px solid #E2E8F0; display:flex; gap:6px; flex-wrap:wrap; }
  .grade-tab-btn { border:1.5px solid #E2E8F0; border-radius:20px; padding:4px 14px; font-size:.78rem; font-weight:600; background:#fff; color:#64748B; cursor:pointer; white-space:nowrap; margin-bottom:8px; transition:background .15s,border-color .15s,color .15s; }
  .grade-tab-btn:hover { border-color:#93C5FD; color:#1D4ED8; background:#EFF6FF; }
  .grade-tab-btn.active { background:#0EA5E9; border-color:#0EA5E9; color:#fff; }
  .grade-tab-btn[data-grade="10"].active { background:#2563EB; border-color:#2563EB; }
  .grade-tab-btn[data-grade="11"].active { background:#7C3AED; border-color:#7C3AED; }
  .grade-tab-btn[data-grade="12"].active { background:#059669; border-color:#059669; }

  /* Body = side nav + scrolling table, fixed height so the page never grows with the list */
  .list-body { display:flex; align-items:stretch; height:clamp(300px, calc(100vh - 340px), 560px); overflow:hidden; }
  .side-nav { width:84px; min-width:84px; overflow-y:auto; flex-shrink:0; background:#F8FAFC; border-right:1.5px solid #E2E8F0; padding:8px 6px; display:flex; flex-direction:column; gap:3px; }
  .side-nav-label { font-size:.6rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:6px 4px 3px; color:#94A3B8; line-height:1; border-top:1px solid #E2E8F0; margin-top:4px; }
  .side-nav-label:first-child { border-top:none; margin-top:0; }
  .side-btn { display:block; width:100%; text-align:center; padding:5px 4px; border-radius:7px; border:1.5px solid #BFDBFE; background:#EFF6FF; color:#1D4ED8; font-size:.72rem; font-weight:600; cursor:pointer; line-height:1.25; word-break:break-word; transition:background .12s,border-color .12s,color .12s; }
  .side-btn[data-grade="11"] { color:#6D28D9; border-color:#DDD6FE; background:#F5F3FF; }
  .side-btn[data-grade="12"] { color:#065F46; border-color:#A7F3D0; background:#ECFDF5; }
  .side-btn:hover, .side-btn.active { background:#2563EB; border-color:#2563EB; color:#fff; }
  .side-btn[data-grade="11"]:hover, .side-btn[data-grade="11"].active { background:#7C3AED; border-color:#7C3AED; }
  .side-btn[data-grade="12"]:hover, .side-btn[data-grade="12"].active { background:#059669; border-color:#059669; }
  .tbl-wrap { flex:1; min-width:0; overflow:auto; -webkit-overflow-scrolling:touch; }
  .admin-table { font-size:.82rem; min-width:620px; margin:0; }
  .admin-table thead th { background:linear-gradient(135deg,#075985 0%,#0EA5E9 60%,#22D3EE 100%); color:#fff; font-weight:700; border:none; padding:11px 10px; white-space:nowrap; position:sticky; top:0; z-index:2; }
  .admin-table tbody tr:hover { background:rgba(224,242,254,.35); }
  .admin-table td { vertical-align:middle; padding:9px 10px; }
  .sep-row td { background:#EFF6FF !important; padding:4px 10px !important; font-size:.73rem; font-weight:700; color:#1D4ED8; border-top:2px solid #BFDBFE !important; position:sticky; top:40px; z-index:1; }
  .adm-icon-btn { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:7px; border:1.5px solid; background:transparent; font-size:.85rem; cursor:pointer; transition:background .15s,color .15s; }
  .adm-icon-btn.btn-outline-info { color:#0891B2; border-color:#0891B2; }
  .adm-icon-btn.btn-outline-info:hover { background:#0891B2; color:#fff; }
  .search-empty { display:none; text-align:center; padding:28px; color:#94A3B8; font-size:.84rem; }
  @media (max-width: 640px) {
    .side-nav { display:none; }
    .admin-table td, .admin-table th { padding:7px 6px; font-size:.73rem; }
    .list-body { height:clamp(260px, calc(100vh - 360px), 480px); }
  }
</style>
